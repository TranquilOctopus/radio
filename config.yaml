alarm:
  enabled: false
  time: "07:00"

snooze:
  duration_minutes: 9

radio:
  stations:
    - name: "NRK P1"
      url: "https://lyd.nrk.no/nrk_radio_p1_ostlandssendingen_mp3_h"
    - name: "NRK P2"
      url: "https://lyd.nrk.no/nrk_radio_p2_mp3_h"
    - name: "NRK P3"
      url: "https://lyd.nrk.no/nrk_radio_p3_mp3_h"
    - name: "BBC World Service"
      url: "https://stream.live.vc.bbcmedia.co.uk/bbc_world_service"
  default_station: 0
  volume: 70

led:
  brightness: 80
  # Strip type: "WS2812" (RGB, 3 channels) or "SK6812" (RGBW, 4 channels).
  strip_type: WS2812
  num_leds: 10
  # Fade duration (ms) when the LED button ramps the strip on or off.
  ramp_ms: 400

splitflap:
  # Per-module step offsets for mechanical tuning (filled in during hardware bench)
  module_offsets: [0, 0, 0, 0]
  magnet_position: 730
  speed_rpm: 10

hardware:
  i2c_bus: 1
  buttons:
    # GPIO0 is the Pi's HAT-ID pin (ID_SD). It works as a plain input as long
    # as dtparam=i2c_vc stays off (the default).
    snooze_pin: 0
    # Illuminated LED-toggle button ("Illu" header).
    led_pin: 12
    double_press_ms: 400
    # Seconds the LEDs stay at full brightness after the button is released
    # before fading off.
    led_hold_seconds: 5
  # Audio path: PCM5122 (hardware mode) → MAX9744 (analog volume, slide pot on
  # VOL). Neither chip is on I2C; these are the mute/strap lines (BCM numbers).
  audio:
    dac_xsmt_pin: 22   # DAC soft mute, high = play
    dac_att0_pin: 16   # DAC gain strap, low = 0 dB
    dac_mast_pin: 23   # keep low: DAC is the I2S slave
    dac_flt_pin: 25    # low = normal-latency filter
    amp_shdn_pin: 4    # amp ~SHDN, high = on
    amp_mute_pin: 24   # amp MUTE, high = muted
